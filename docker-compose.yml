services:
  db:
    image: postgres:11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gym
    ports:
      - 15432:5432
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        - NO=value
      target: prod
    ports:
      - 3333:3000
    environment:
      # srvx --prod would default this to production, leaving EnvHelper without an env file to read
      - NODE_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
    # entrypoint: "sleep 1000000" # debug